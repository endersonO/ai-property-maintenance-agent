name: CI

on:
  push:
    branches: [main]
  pull_request:

# Gates: types, lint, unit + contract tests, PostgreSQL integration tests,
# executor evals (scripted model, deterministic) and a production build.
# Agent evals need a real model and API quota, so they run manually, not here.

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: homefix_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/homefix_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate and seed the test database
        run: DATABASE_URL="$TEST_DATABASE_URL" db/reset.sh
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Executor evals
        run: pnpm evals
      - run: pnpm build
