<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" width="100%" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: none; stroke: #94a3b8; stroke-width: 1.2; }
    .rt { fill: none; stroke: #2563eb; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .hl { fill: #2563eb; fill-opacity: .06; stroke: #2563eb; stroke-width: 1.2; }
    .t { fill: #0f172a; font-size: 13px; font-weight: 600; }
    .s { fill: #475569; font-size: 11px; }
    .k { fill: #2563eb; font-size: 11px; font-weight: 600; }
    .ln { fill: none; stroke: #64748b; stroke-width: 1.2; }
    .ds { fill: none; stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .ar { fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .t { fill: #f1f5f9; }
      .s { fill: #cbd5e1; }
      .k { fill: #60a5fa; }
      .box { stroke: #64748b; }
      .rt, .hl { stroke: #60a5fa; }
      .hl { fill: #60a5fa; }
      .ln, .ds { stroke: #94a3b8; }
      .ar { fill: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ar" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="720" height="640"/>

  <!-- Entradas -->
  <rect class="box" x="20" y="10" width="210" height="46" rx="8"/>
  <text class="t" x="125" y="30" text-anchor="middle">Tenant Portal</text>
  <text class="s" x="125" y="46" text-anchor="middle">Chat · simulated tenant</text>

  <rect class="box" x="255" y="10" width="210" height="46" rx="8"/>
  <text class="t" x="360" y="30" text-anchor="middle">Agent Inspector</text>
  <text class="s" x="360" y="46" text-anchor="middle">Runs · tool events · cost</text>

  <rect class="box" x="490" y="10" width="210" height="46" rx="8"/>
  <text class="t" x="595" y="30" text-anchor="middle">Eval Runner</text>
  <text class="s" x="595" y="46" text-anchor="middle">pnpm evals · GitHub Actions</text>

  <path class="ln" d="M125 56 V88" marker-end="url(#a)"/>
  <path class="ln" d="M595 56 V88" marker-end="url(#a)"/>
  <path class="ds" d="M465 33 H478 V70 H710 V575 H702" marker-end="url(#a)"/>
  <text class="s" x="700" y="66" text-anchor="end">reads traces</text>

  <!-- Workflow Registry -->
  <rect class="hl" x="20" y="90" width="680" height="56" rx="8"/>
  <text class="t" x="360" y="111" text-anchor="middle">Workflow Registry</text>
  <text class="s" x="360" y="130" text-anchor="middle">maintenance · ticket-status  —  prompt + tools + eval cases (data, not engine code)</text>

  <path class="ln" d="M360 146 V178" marker-end="url(#a)"/>

  <!-- Agent Runtime -->
  <rect class="rt" x="20" y="180" width="680" height="300" rx="10"/>
  <text class="k" x="36" y="200">AGENT RUNTIME · generic, knows nothing about maintenance</text>

  <rect class="box" x="40" y="212" width="640" height="46" rx="8"/>
  <text class="t" x="360" y="232" text-anchor="middle">Orchestrator loop</text>
  <text class="s" x="360" y="248" text-anchor="middle">model → tool calls → executor → results → model · max steps · timeouts</text>

  <path class="ln" d="M165 258 V283" marker-end="url(#a)"/>
  <path class="ln" d="M500 258 V283" marker-end="url(#a)"/>

  <rect class="box" x="40" y="285" width="250" height="120" rx="8"/>
  <text class="t" x="165" y="306" text-anchor="middle">Model port</text>
  <text class="s" x="165" y="328" text-anchor="middle">OpenAI · strict tool calling</text>
  <text class="s" x="165" y="344" text-anchor="middle">structured outputs · usage</text>
  <text class="s" x="165" y="360" text-anchor="middle">Scripted model (evals)</text>
  <text class="k" x="165" y="388" text-anchor="middle">only returns text or tool calls</text>

  <rect class="box" x="320" y="285" width="360" height="120" rx="8"/>
  <text class="t" x="500" y="306" text-anchor="middle">Tool Executor pipeline</text>
  <text class="s" x="500" y="328" text-anchor="middle">1 validate (Zod) → 2 authorize (tenant ↔ property)</text>
  <text class="s" x="500" y="344" text-anchor="middle">→ 3 policy (agency rules)</text>
  <text class="s" x="500" y="360" text-anchor="middle">→ 4 idempotency → 5 execute tool</text>
  <text class="k" x="500" y="388" text-anchor="middle">priority + forced escalation decided by policy</text>

  <rect class="box" x="40" y="425" width="250" height="40" rx="8"/>
  <text class="t" x="165" y="442" text-anchor="middle">Tracer (transversal)</text>
  <text class="s" x="165" y="457" text-anchor="middle">run · steps · tokens · cost · errors</text>

  <path class="ln" d="M165 465 V518" marker-end="url(#a)"/>
  <path class="ln" d="M500 405 V518" marker-end="url(#a)"/>

  <!-- Repository -->
  <rect class="box" x="20" y="520" width="680" height="70" rx="8"/>
  <text class="t" x="360" y="542" text-anchor="middle">Repository port</text>
  <text class="s" x="360" y="560" text-anchor="middle">PostgreSQL / Supabase (app)  ·  In-memory (evals)</text>
  <text class="s" x="360" y="577" text-anchor="middle">agencies · policies · properties · tickets · review_queue · runs · run_events</text>

  <text class="k" x="360" y="620" text-anchor="middle">Invariant: the LLM never touches the database — only the Tool Executor writes.</text>
</svg>
